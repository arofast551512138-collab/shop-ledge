<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>บัญชีร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  --bg:#EEF2F1; --card:#fff; --ink:#12201E; --muted:#5F6F6C; --line:#DCE4E2;
  --brand:#12332F; --in:#0B8A62; --in-bg:#E1F4EC; --out:#CF4638; --out-bg:#FBE8E5;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
h1{font-size:20px;font-weight:700}
h2{font-size:16px;font-weight:600;margin-bottom:10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #3DA58A;outline-offset:2px}

/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.range{display:none;gap:8px;margin-bottom:12px}.range.on{display:flex}
.range input{flex:1;min-width:0}

/* hero */
.hero{background:var(--brand);color:#fff;border-radius:var(--r);padding:18px}
.hero .lbl{font-size:14px;opacity:.8}
.hero .big{font-size:36px;font-weight:700;line-height:1.2;margin:2px 0 14px}
.hero .big.neg{color:#FFB4AB}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.1)}
.mini .lbl{font-size:13px}.mini b{display:block;font-size:18px;font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;border:1px solid var(--line)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line)}
.donut div{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
.donut div b{display:block;font-size:14px;color:var(--ink)}
.legend{flex:1;min-width:150px;display:grid;gap:6px;font-size:14px}
.legend p{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend span{margin-left:auto;color:var(--muted)}

/* list */
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.btn.dark{background:var(--brand);color:#fff;border-color:var(--brand)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.dot.income{background:var(--in-bg);color:var(--in)}.dot.expense{background:var(--out-bg);color:var(--out)}
.row .mid{flex:1;min-width:0;text-align:left}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.amt{font-weight:600;text-align:right}
.amt.income{color:var(--in)}.amt.expense{color:var(--out)}
.del{color:var(--muted);font-size:20px;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.export{display:flex;gap:8px;margin-top:12px}.export .btn{flex:1}

/* form */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#DCE4E2;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{padding:11px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on.income{background:var(--in);color:#fff}
.seg button.on.expense{background:var(--out);color:#fff}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 5px}
.amount{font-size:28px;font-weight:700;text-align:right}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pays button{padding:11px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.pays button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.save{width:100%;margin-top:20px;padding:15px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.cancel{width:100%;margin-top:8px;padding:12px;color:var(--muted)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
nav button{padding:12px 0 10px;font-size:13px;color:var(--muted);display:grid;gap:2px;justify-items:center}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== หน้าสรุป ===== -->
  <section class="view on" id="v-dash">
    <div class="top"><h1>สรุปบัญชีร้าน</h1></div>
    <div class="chips" id="periods">
      <button class="chip" data-p="today">วันนี้</button>
      <button class="chip on" data-p="month">เดือนนี้</button>
      <button class="chip" data-p="all">ทั้งหมด</button>
      <button class="chip" data-p="custom">เลือกช่วงเวลา</button>
    </div>
    <div class="range" id="range">
      <input type="date" id="from" aria-label="ตั้งแต่วันที่">
      <input type="date" id="to" aria-label="ถึงวันที่">
    </div>

    <div class="hero">
      <div class="lbl">กำไรสุทธิของกิจการ</div>
      <div class="big num" id="net">฿0.00</div>
      <div class="split">
        <div class="mini"><span class="lbl">รายรับรวม</span><b class="num" id="sumIn">฿0.00</b></div>
        <div class="mini"><span class="lbl">รายจ่ายรวม (รวมส่วนตัว)</span><b class="num" id="sumOut">฿0.00</b></div>
        <div class="mini"><span class="lbl">กำไรขั้นต้น</span><b class="num" id="gross">฿0.00</b></div>
        <div class="mini"><span class="lbl">ค่าใช้จ่ายส่วนตัว</span><b class="num" id="pers">฿0.00</b></div>
        <div class="mini" style="grid-column:1/-1"><span class="lbl">เงินคงเหลือสุทธิ (รายรับ − รายจ่ายทั้งหมด)</span><b class="num" id="left">฿0.00</b></div>
      </div>
    </div>

    <div class="card">
      <h2>สัดส่วนรายจ่ายตามหมวดหมู่</h2>
      <div class="donut-wrap">
        <div class="donut" id="donut"><div><span>รายจ่าย<b class="num" id="donutTotal">฿0</b></span></div></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="card">
      <h2>รายการ</h2>
      <div class="tools">
        <input type="search" id="q" placeholder="ค้นหาชื่อรายการ หมวดหมู่ หรือจำนวนเงิน">
      </div>
      <div id="list"></div>
      <div class="export">
        <button class="btn" id="expCsv">Export CSV</button>
        <button class="btn" id="expXlsx">Export Excel</button>
      </div>
    </div>
  </section>

  <!-- ===== หน้าบันทึก ===== -->
  <section class="view" id="v-add">
    <div class="top"><h1 id="formTitle">บันทึกรายการ</h1></div>
    <div class="seg" id="seg">
      <button class="income" data-t="income">รายรับ</button>
      <button class="expense on" data-t="expense">รายจ่าย</button>
    </div>

    <label for="amount">จำนวนเงิน (บาท)</label>
    <input class="amount num" id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">

    <label for="title">ชื่อรายการ / คำอธิบาย</label>
    <input id="title" type="text" maxlength="120" placeholder="เช่น ซื้อวัตถุดิบ, ค่าเช่าร้าน, ขายสินค้า A">

    <label for="cat">หมวดหมู่</label>
    <select id="cat"></select>

    <label for="dt">วันที่และเวลา</label>
    <input id="dt" type="datetime-local">

    <label>ช่องทางชำระเงิน</label>
    <div class="pays" id="pays"></div>

    <button class="save" id="save">บันทึกรายการ</button>
    <button class="cancel" id="cancel" hidden>ยกเลิกการแก้ไข</button>
  </section>
</div>

<nav><div>
  <button class="on" data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>สรุป</button>
  <button data-v="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>บันทึก</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'shop-ledger-v1';
const BIZ_EXP = ['ต้นทุน', 'ค่าใช้จ่ายคงที่', 'ค่าแรง/เงินเดือน', 'การตลาด', 'ค่าขนส่ง/ค่าคอม', 'อื่นๆ'];
const PERSONAL = ['ส่วนตัว: อาหาร/เครื่องดื่ม', 'ส่วนตัว: เดินทาง/น้ำมัน', 'ส่วนตัว: ที่พัก/ค่าน้ำค่าไฟ', 'ส่วนตัว: สุขภาพ',
  'ส่วนตัว: ช้อปปิ้ง/ของใช้', 'ส่วนตัว: บันเทิง/ท่องเที่ยว', 'ส่วนตัว: การศึกษา', 'ส่วนตัว: ครอบครัว/ของขวัญ', 'ส่วนตัว: อื่นๆ'];
const CATS = {
  income:  ['รายได้จากการขาย', 'รายได้อื่นๆ'],
  expense: [...BIZ_EXP, ...PERSONAL]
};
const PAYS = ['เงินสด', 'โอนผ่านธนาคาร', 'บัตรเครดิต'];
const COLORS = ['#0E7C86', '#E0763A', '#6C5CE7', '#C2417A', '#8A9A2B', '#7A8794', '#2E86DE', '#D4A017', '#16A085', '#B03A2E', '#5D6D7E', '#AF7AC5', '#48C9B0', '#F1948A'];

/* กลุ่มบัญชี: ขาย / รายได้อื่น / ต้นทุนขาย / ค่าใช้จ่ายดำเนินงาน / ส่วนตัว (ส่วนตัวไม่นับเป็นค่าใช้จ่ายของกิจการ) */
const grp = i => i.type === 'income' ? (i.cat === 'รายได้จากการขาย' ? 'รายได้จากการขาย' : 'รายได้อื่น')
  : i.cat === 'ต้นทุน' ? 'ต้นทุนขาย'
  : (PERSONAL.includes(i.cat) || i.cat.startsWith('ส่วนตัว')) ? 'ค่าใช้จ่ายส่วนตัว' : 'ค่าใช้จ่ายดำเนินงาน';
const r2 = x => Math.round(x * 100) / 100;
function calc(rows) {
  const g = {}; rows.forEach(i => { const k = grp(i); g[k] = (g[k] || 0) + i.amount; });
  const v = k => r2(g[k] || 0);
  const sale = v('รายได้จากการขาย'), oth = v('รายได้อื่น'), cogs = v('ต้นทุนขาย'), opex = v('ค่าใช้จ่ายดำเนินงาน'), pers = v('ค่าใช้จ่ายส่วนตัว');
  const gross = r2(sale - cogs), net = r2(gross - opex + oth);   // กำไรขั้นต้น = ขาย − ต้นทุนขาย ; กำไรสุทธิ = ขั้นต้น − ค่าใช้จ่ายดำเนินงาน + รายได้อื่น
  return {sale, oth, cogs, opex, pers, inc: r2(sale + oth), out: r2(cogs + opex + pers), gross, net, left: r2(net - pers)};
}

let items = load();
let type = 'expense', pay = PAYS[0], editId = null, period = 'month';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => '฿' + Number(n).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pad = n => String(n).padStart(2, '0');
const dayStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const nowLocal = () => { const d = new Date(); return dayStr(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { toast('บันทึกลงเครื่องไม่ได้ ลอง Export สำรองไว้'); } }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- ข้อมูลนำเข้าจากไฟล์ "บัญชีกระแสเงินสดของท่านร้าน.xlsx" (ชีต 0268–1069 = ก.พ. 2568 – ต.ค. 2569 พ.ศ.) ---------- */

let seededNow = 0;
(function seed() {
  const FLAG = 'shop-ledger-seed-v1';
  try { if (localStorage.getItem(FLAG)) return; } catch (e) { return; }
  const have = new Set(items.map(i => i.id));
  SEED.forEach((r, k) => {
    const id = 'imp' + k.toString(36);
    if (have.has(id)) return;
    items.push({id, type: r[1] === 'i' ? 'income' : 'expense', dt: r[0] + 'T00:00', title: r[3], cat: SEED_CATS[r[2]], amount: r[4], pay: PAYS[r[5]]});
    seededNow++;
  });
  persist();
  try { localStorage.setItem(FLAG, '1'); } catch (e) {}
})();

/* ---------- ช่วงเวลา ---------- */
function range() {
  const t = dayStr(new Date());
  if (period === 'today') return [t, t];
  if (period === 'month') return [t.slice(0, 8) + '01', t.slice(0, 8) + '31'];
  if (period === 'custom') return [$('from').value || '0000-00-00', $('to').value || '9999-99-99'];
  return ['0000-00-00', '9999-99-99'];
}
const inPeriod = () => { const [a, b] = range(); return items.filter(i => { const d = i.dt.slice(0, 10); return d >= a && d <= b; }); };

/* ---------- วาดหน้าสรุป ---------- */
function render() {
  const rows = inPeriod();
  const c = calc(rows), inc = c.inc, out = c.out, net = c.net;
  const sgn = n => (n < 0 ? '-' : '') + baht(Math.abs(n));
  $('sumIn').textContent = baht(inc);
  $('sumOut').textContent = baht(out);
  $('gross').textContent = sgn(c.gross);
  $('pers').textContent = baht(c.pers);
  $('left').textContent = sgn(c.left);
  $('net').textContent = (net < 0 ? '-' : '') + baht(Math.abs(net));
  $('net').classList.toggle('neg', net < 0);

  // donut: สัดส่วนรายจ่ายตามหมวดหมู่
  const by = {};
  rows.filter(i => i.type === 'expense').forEach(i => by[i.cat] = (by[i.cat] || 0) + i.amount);
  const ents = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('donutTotal').textContent = '฿' + Math.round(out).toLocaleString('th-TH');
  if (!ents.length) {
    $('donut').style.background = 'var(--line)';
    $('legend').innerHTML = '<p style="color:var(--muted)">ยังไม่มีรายจ่ายในช่วงนี้</p>';
  } else {
    let acc = 0;
    const stops = ents.map(([, v], k) => { const s = acc / out * 100; acc += v; return COLORS[k % COLORS.length] + ' ' + s + '% ' + (acc / out * 100) + '%'; });
    $('donut').style.background = 'conic-gradient(' + stops.join(',') + ')';
    $('legend').innerHTML = ents.map(([c, v], k) =>
      '<p><i style="background:' + COLORS[k % COLORS.length] + '"></i>' + esc(c) + '<span class="num">' + Math.round(v / out * 100) + '%</span></p>').join('');
  }
  renderList();
}

function shown() {
  const q = $('q').value.trim().toLowerCase();
  return inPeriod().filter(i => !q || (i.title + ' ' + i.cat + ' ' + i.pay + ' ' + i.amount).toLowerCase().includes(q))
                   .sort((a, b) => b.dt.localeCompare(a.dt));
}

function renderList() {
  const rows = shown();
  if (!rows.length) { $('list').innerHTML = '<div class="empty">ไม่พบรายการ กดแท็บ “บันทึก” เพื่อเพิ่มรายการแรก</div>'; return; }
  $('list').innerHTML = rows.slice(0, 100).map(i => {
    const d = new Date(i.dt);
    const when = d.toLocaleDateString('th-TH', {day: 'numeric', month: 'short', year: '2-digit'}) + ' ' + i.dt.slice(11, 16);
    return '<div class="row" data-id="' + i.id + '">' +
      '<div class="dot ' + i.type + '">' + (i.type === 'income' ? '+' : '−') + '</div>' +
      '<button class="mid" data-edit="' + i.id + '"><div class="t">' + esc(i.title) + '</div>' +
      '<div class="s">' + esc(i.cat) + ' · ' + esc(i.pay) + ' · ' + when + '</div></button>' +
      '<div class="amt num ' + i.type + '">' + (i.type === 'income' ? '+' : '−') + baht(i.amount) + '</div>' +
      '<button class="del" data-del="' + i.id + '" aria-label="ลบรายการ">×</button></div>';
  }).join('') + (rows.length > 100 ? '<div class="empty">แสดง 100 รายการล่าสุด (Export เพื่อดูทั้งหมด)</div>' : '');
}

/* ---------- ฟอร์ม ---------- */
function setType(t) {
  type = t;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const opt = c => '<option>' + c + '</option>';
  $('cat').innerHTML = t === 'expense'
    ? '<optgroup label="ค่าใช้จ่ายของกิจการ">' + BIZ_EXP.map(opt).join('') + '</optgroup><optgroup label="ค่าใช้จ่ายส่วนตัว">' + PERSONAL.map(opt).join('') + '</optgroup>'
    : CATS[t].map(opt).join('');
}
function setPay(p) {
  pay = p;
  $('pays').innerHTML = PAYS.map(x => '<button type="button" class="' + (x === p ? 'on' : '') + '" data-pay="' + x + '">' + x + '</button>').join('');
}
function resetForm() {
  editId = null;
  setType('expense'); setPay(PAYS[0]);
  $('amount').value = ''; $('title').value = ''; $('dt').value = nowLocal();
  $('formTitle').textContent = 'บันทึกรายการ';
  $('save').textContent = 'บันทึกรายการ';
  $('cancel').hidden = true;
}
function show(v) {
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'add' && editId === null) $('dt').value = nowLocal();
  window.scrollTo(0, 0);
}

$('seg').onclick = e => { const b = e.target.closest('button'); if (b) setType(b.dataset.t); };
$('pays').onclick = e => { const b = e.target.closest('button'); if (b) setPay(b.dataset.pay); };
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b) { if (b.dataset.v === 'dash') resetForm(); show(b.dataset.v); render(); } };

$('save').onclick = () => {
  const amount = parseFloat($('amount').value);
  const title = $('title').value.trim();
  if (!(amount > 0)) { toast('กรอกจำนวนเงินให้มากกว่า 0'); $('amount').focus(); return; }
  if (!title) { toast('กรอกชื่อรายการ'); $('title').focus(); return; }
  if (!$('dt').value) { toast('เลือกวันที่และเวลา'); return; }
  const rec = {id: editId || Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
               type, dt: $('dt').value, title, cat: $('cat').value, amount: Math.round(amount * 100) / 100, pay};
  if (editId) items = items.map(i => i.id === editId ? rec : i); else items.push(rec);
  persist();
  toast(editId ? 'แก้ไขรายการแล้ว' : 'บันทึกรายการแล้ว');
  resetForm(); show('dash'); render();
};
$('cancel').onclick = () => { resetForm(); show('dash'); };

/* ---------- แก้ไข / ลบ ---------- */
$('list').onclick = e => {
  const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]');
  if (dl) {
    if (confirm('ลบรายการนี้ใช่ไหม?')) { items = items.filter(i => i.id !== dl.dataset.del); persist(); render(); toast('ลบรายการแล้ว'); }
  } else if (ed) {
    const i = items.find(x => x.id === ed.dataset.edit); if (!i) return;
    editId = i.id; setType(i.type); setPay(i.pay);
    $('cat').value = i.cat; $('amount').value = i.amount; $('title').value = i.title; $('dt').value = i.dt;
    $('formTitle').textContent = 'แก้ไขรายการ';
    $('save').textContent = 'บันทึกการแก้ไข';
    $('cancel').hidden = false;
    show('add');
  }
};

/* ---------- ตัวกรอง ---------- */
$('periods').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  period = b.dataset.p;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  $('range').classList.toggle('on', period === 'custom');
  render();
};
$('from').onchange = $('to').onchange = render;
$('q').oninput = renderList;

/* ---------- Export ---------- */
function exportRows() {
  return shown().reverse().map(i => [i.dt.slice(0, 10), i.dt.slice(11, 16), i.type === 'income' ? 'รายรับ' : 'รายจ่าย', i.title, i.cat, i.amount, i.pay]);
}
const HEAD = ['วันที่', 'เวลา', 'ประเภท', 'รายการ', 'หมวดหมู่', 'จำนวนเงิน (บาท)', 'ช่องทางชำระเงิน'];
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('expCsv').onclick = () => {
  const rows = exportRows();
  if (!rows.length) return toast('ไม่มีรายการให้ Export');
  const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '\uFEFF' + [HEAD, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  download(new Blob([csv], {type: 'text/csv;charset=utf-8'}), 'รายรับรายจ่าย_' + dayStr(new Date()) + '.csv');
};
/* รายงาน Excel แบบละเอียด: 4 ชีต (สรุปผลประกอบการ / สมุดบัญชี / รายรับ / รายจ่าย) ใช้สูตรคำนวณจริงในไฟล์ */
$('expXlsx').onclick = () => {
  const rows = inPeriod().sort((a, b) => a.dt.localeCompare(b.dt));   // ทั้งช่วงเวลาที่เลือก (ไม่ขึ้นกับช่องค้นหา เพื่อให้ตัวเลขกำไรถูกต้อง)
  if (!rows.length) return toast('ไม่มีรายการให้ Export');
  if (typeof XLSX === 'undefined') return toast('ต้องต่ออินเทอร์เน็ตเพื่อ Export Excel (หรือใช้ CSV)');
  const wb = XLSX.utils.book_new(), c = calc(rows);
  const MONEY = '#,##0.00;[Red]-#,##0.00;"-"', PCT = '0.0%';
  const bd = {style: 'thin', color: {rgb: 'BFCBC8'}}, border = {top: bd, bottom: bd, left: bd, right: bd};
  const fill = rgb => ({patternType: 'solid', fgColor: {rgb}});
  const ST = {
    title: {font: {bold: true, sz: 16, color: {rgb: '12332F'}}},
    head: {font: {bold: true, color: {rgb: 'FFFFFF'}}, fill: fill('12332F'), alignment: {horizontal: 'center', vertical: 'center', wrapText: true}, border},
    sec: {font: {bold: true, color: {rgb: '12332F'}}, fill: fill('DCE4E2'), border},
    sub: {font: {bold: true}, fill: fill('F1F5F4'), border},
    key: {font: {bold: true, sz: 12, color: {rgb: 'FFFFFF'}}, fill: fill('0B8A62'), border},
    cell: {border}
  };
  const label = {today: 'วันนี้', month: 'เดือนนี้', all: 'ทั้งหมด', custom: 'กำหนดเอง'}[period];
  const periodText = 'ช่วงเวลา: ' + label + ' (ข้อมูลวันที่ ' + rows[0].dt.slice(0, 10) + ' ถึง ' + rows[rows.length - 1].dt.slice(0, 10) + ')';
  const sheet = () => ({ws: {}, mr: 0, mc: 0});
  function put(S, r, col, v, st, f, z) {
    const cell = typeof v === 'number' ? {t: 'n', v} : {t: 's', v: String(v == null ? '' : v)};
    if (f) cell.f = f; if (z) cell.z = z; if (st) cell.s = st;
    S.ws[XLSX.utils.encode_cell({r, c: col})] = cell; S.mr = Math.max(S.mr, r); S.mc = Math.max(S.mc, col);
  }
  function add(name, S, widths) {
    S.ws['!ref'] = XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: S.mr, c: S.mc}});
    S.ws['!cols'] = widths.map(w => ({wch: w}));
    XLSX.utils.book_append_sheet(wb, S.ws, name);
  }
  const n = rows.length, lastE = 4 + n, totE = 5 + n, L = "'สมุดบัญชี'!";
  const rg = col => L + '$' + col + '$5:$' + col + '$' + lastE;
  const sumCat = cat => r2(rows.filter(i => i.cat === cat).reduce((s, i) => s + i.amount, 0));

  /* ---- ชีต 1: สรุปผลประกอบการ ---- */
  const sm = sheet(); let r = 0; const SALE_ER = 7;   // แถวยอดขาย (ใช้เป็นฐานคิด %)
  put(sm, 0, 0, 'รายงานสรุปผลประกอบการ', ST.title); put(sm, 1, 0, periodText); put(sm, 2, 0, 'ออกรายงานเมื่อ: ' + new Date().toLocaleString('th-TH'));
  ['รายการ', 'จำนวนเงิน (บาท)', '% ของยอดขาย'].forEach((h, k) => put(sm, 4, k, h, ST.head));
  r = 5;
  const sec = t => { for (let k = 0; k < 3; k++) put(sm, r, k, k ? '' : t, ST.sec); r++; };
  function line(lbl, f, v, st = ST.cell) {
    const er = r + 1;
    put(sm, r, 0, lbl, st); put(sm, r, 1, r2(v), st, f, MONEY);
    put(sm, r, 2, c.sale ? r2(v / c.sale) : 0, st, 'IF($B$' + SALE_ER + '=0,0,B' + er + '/$B$' + SALE_ER + ')', PCT);
    r++; return er;
  }
  const catLines = (g, base, col) => [...new Set([...base, ...rows.filter(i => grp(i) === g).map(i => i.cat)])]
    .map(cat => line('     ' + cat, 'SUMIFS(' + rg(col) + ',' + rg('D') + ',"' + cat + '")', sumCat(cat)));
  const total = (lbl, ers, v, st = ST.sub) => line(lbl, 'SUM(B' + ers[0] + ':B' + ers[ers.length - 1] + ')', v, st);

  sec('1. รายรับ');
  const sR = catLines('รายได้จากการขาย', ['รายได้จากการขาย'], 'G'), oR = catLines('รายได้อื่น', ['รายได้อื่นๆ'], 'G');
  total('รวมรายรับทั้งหมด', [sR[0], oR[oR.length - 1]], c.inc);
  sec('2. ต้นทุนขาย');
  const cR = catLines('ต้นทุนขาย', ['ต้นทุน'], 'H'), tC = total('รวมต้นทุนขาย', cR, c.cogs);
  const gross = line('กำไรขั้นต้น (รายได้จากการขาย − ต้นทุนขาย)', 'B' + sR[0] + '-B' + tC, c.gross, ST.key);
  sec('3. ค่าใช้จ่ายในการดำเนินงาน');
  const pR = catLines('ค่าใช้จ่ายดำเนินงาน', BIZ_EXP.slice(1), 'H'), tO = total('รวมค่าใช้จ่ายในการดำเนินงาน', pR, c.opex);
  sec('4. กำไรสุทธิของกิจการ');
  const a1 = line('กำไรขั้นต้น', 'B' + gross, c.gross), a2 = line('หัก: ค่าใช้จ่ายในการดำเนินงาน', 'B' + tO, c.opex);
  const a3 = line('บวก: รายได้อื่นๆ', 'SUM(B' + oR[0] + ':B' + oR[oR.length - 1] + ')', c.oth);
  const net = line('กำไรสุทธิของกิจการ', 'B' + a1 + '-B' + a2 + '+B' + a3, c.net, ST.key);
  sec('5. ค่าใช้จ่ายส่วนตัว (ไม่นับเป็นต้นทุน/ค่าใช้จ่ายของกิจการ)');
  const sR2 = catLines('ค่าใช้จ่ายส่วนตัว', PERSONAL, 'H'), tP = total('รวมค่าใช้จ่ายส่วนตัว', sR2, c.pers);
  sec('6. เงินคงเหลือ');
  const b1 = line('กำไรสุทธิของกิจการ', 'B' + net, c.net), b2 = line('หัก: ค่าใช้จ่ายส่วนตัว', 'B' + tP, c.pers);
  line('เงินคงเหลือสุทธิ (รายรับรวม − รายจ่ายรวมทั้งหมด)', 'B' + b1 + '-B' + b2, c.left, ST.key);
  line('ตรวจสอบ: ยอดคงเหลือตามสมุดบัญชี', L + 'G' + totE + '-' + L + 'H' + totE, r2(c.inc - c.out));
  r++; for (let k = 0; k < 4; k++) put(sm, r, k, k ? '' : '7. สรุปตามช่องทางชำระเงิน', ST.sec); r++;
  ['ช่องทาง', 'รายรับ', 'รายจ่าย', 'คงเหลือ'].forEach((h, k) => put(sm, r, k, h, ST.head)); r++;
  const pays = [...new Set([...PAYS, ...rows.map(i => i.pay)])], p0 = r + 1;
  const pv = (p, t) => r2(rows.filter(i => i.pay === p && i.type === t).reduce((s, i) => s + i.amount, 0));
  pays.forEach(p => {
    const er = r + 1;
    put(sm, r, 0, p, ST.cell);
    put(sm, r, 1, pv(p, 'income'), ST.cell, 'SUMIFS(' + rg('G') + ',' + rg('F') + ',"' + p + '")', MONEY);
    put(sm, r, 2, pv(p, 'expense'), ST.cell, 'SUMIFS(' + rg('H') + ',' + rg('F') + ',"' + p + '")', MONEY);
    put(sm, r, 3, r2(pv(p, 'income') - pv(p, 'expense')), ST.cell, 'B' + er + '-C' + er, MONEY); r++;
  });
  put(sm, r, 0, 'รวม', ST.sub);
  [[1, c.inc], [2, c.out], [3, c.left]].forEach(([k, v]) => { const col = 'ABCD'[k];
    put(sm, r, k, k === 3 ? r2(c.inc - c.out) : v, ST.sub, 'SUM(' + col + p0 + ':' + col + r + ')', MONEY); });
  add('สรุปผลประกอบการ', sm, [58, 18, 16, 16]);

  /* ---- ชีต 2: สมุดบัญชี (รายรับ | รายจ่าย | คงเหลือสะสม) ---- */
  const lg = sheet();
  put(lg, 0, 0, 'สมุดบัญชีรายรับ-รายจ่าย', ST.title); put(lg, 1, 0, periodText);
  ['วันที่', 'เวลา', 'รายการ', 'หมวดหมู่', 'กลุ่มบัญชี', 'ช่องทางชำระเงิน', 'รายรับ (บาท)', 'รายจ่าย (บาท)', 'คงเหลือสะสม (บาท)'].forEach((h, k) => put(lg, 3, k, h, ST.head));
  let bal = 0;
  rows.forEach((i, k) => {
    const rr = 4 + k, er = rr + 1, inc = i.type === 'income' ? i.amount : 0, ex = i.type === 'expense' ? i.amount : 0;
    bal = r2(bal + inc - ex);
    [i.dt.slice(0, 10), i.dt.slice(11, 16), i.title, i.cat, grp(i), i.pay].forEach((v, q) => put(lg, rr, q, v, ST.cell));
    put(lg, rr, 6, inc, ST.cell, null, MONEY); put(lg, rr, 7, ex, ST.cell, null, MONEY);
    put(lg, rr, 8, bal, ST.cell, k ? 'I' + (er - 1) + '+G' + er + '-H' + er : 'G' + er + '-H' + er, MONEY);
  });
  for (let q = 0; q < 6; q++) put(lg, 4 + n, q, q === 2 ? 'รวมทั้งสิ้น' : '', ST.key);
  put(lg, 4 + n, 6, c.inc, ST.key, 'SUM(G5:G' + lastE + ')', MONEY);
  put(lg, 4 + n, 7, c.out, ST.key, 'SUM(H5:H' + lastE + ')', MONEY);
  put(lg, 4 + n, 8, r2(c.inc - c.out), ST.key, 'G' + totE + '-H' + totE, MONEY);
  add('สมุดบัญชี', lg, [12, 8, 32, 28, 22, 18, 16, 16, 18]);

  /* ---- ชีต 3-4: รายรับ / รายจ่าย แยกตามกลุ่ม > หมวดหมู่ พร้อมยอดรวมแต่ละรายการ ---- */
  function detail(name, title, type, gnames) {
    const D = sheet(), grand = []; let k = 4;
    put(D, 0, 0, title, ST.title); put(D, 1, 0, periodText);
    ['วันที่', 'เวลา', 'รายการ', 'หมวดหมู่', 'ช่องทางชำระเงิน', 'จำนวนเงิน (บาท)'].forEach((h, q) => put(D, 3, q, h, ST.head));
    const band = (lbl, st) => { for (let q = 0; q < 6; q++) put(D, k, q, q ? '' : lbl, st); };
    gnames.forEach(g => {
      const gr = rows.filter(i => i.type === type && grp(i) === g); if (!gr.length) return;
      band('▌ ' + g, ST.sec); k++;
      const subs = [];
      [...new Set(gr.map(i => i.cat))].forEach(cat => {
        const cr = gr.filter(i => i.cat === cat), first = k + 1;
        cr.forEach(i => {
          [i.dt.slice(0, 10), i.dt.slice(11, 16), i.title, i.cat, i.pay].forEach((v, q) => put(D, k, q, v, ST.cell));
          put(D, k, 5, i.amount, ST.cell, null, MONEY); k++;
        });
        band('', ST.sub); put(D, k, 2, 'รวม ' + cat, ST.sub); put(D, k, 4, cr.length, ST.sub, null, '0" รายการ"');
        put(D, k, 5, sumCat(cat), ST.sub, 'SUM(F' + first + ':F' + k + ')', MONEY); subs.push('F' + (k + 1)); k++;
      });
      band('', ST.sub); put(D, k, 2, 'รวม ' + g, ST.sub);
      put(D, k, 5, r2(gr.reduce((s, i) => s + i.amount, 0)), ST.sub, subs.join('+'), MONEY); grand.push('F' + (k + 1)); k++;
    });
    band('', ST.key); put(D, k, 2, 'รวมทั้งหมด', ST.key);
    put(D, k, 5, type === 'income' ? c.inc : c.out, ST.key, grand.length ? grand.join('+') : '0', MONEY);
    add(name, D, [12, 8, 34, 28, 18, 18]);
  }
  detail('รายรับ', 'รายการรายรับ', 'income', ['รายได้จากการขาย', 'รายได้อื่น']);
  detail('รายจ่าย', 'รายการรายจ่าย', 'expense', ['ต้นทุนขาย', 'ค่าใช้จ่ายดำเนินงาน', 'ค่าใช้จ่ายส่วนตัว']);

  XLSX.writeFile(wb, 'รายงานบัญชีร้าน_' + dayStr(new Date()) + '.xlsx');
};

/* ---------- เริ่มต้น ---------- */
resetForm(); render();
if (seededNow) toast('นำเข้า ' + seededNow.toLocaleString('th-TH') + ' รายการจากไฟล์ Excel แล้ว (เลือก “ทั้งหมด” เพื่อดูทุกเดือน)');
</script>
